<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WeChat QR Code</title>
<link rel="canonical" href="https://jerome-kai.github.io/wechat.html" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="favicon-32.png" sizes="32x32" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#242943">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #242943;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .qr-container {
            background: #242943;
            border: #fff 2px solid;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            color: #fff;

        }
        .qr-container img {
            width: 250px;
            height: 325px;
            margin-bottom: 1em;
            color: #fff;
        }
        .back-btn {
		-moz-appearance: none;
		-webkit-appearance: none;
		-ms-appearance: none;
		appearance: none;
		-moz-transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, color 0.2s ease-in-out;
		-webkit-transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, color 0.2s ease-in-out;
		-ms-transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, color 0.2s ease-in-out;
		transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, color 0.2s ease-in-out;
		background-color: transparent;
		border: 0;
		border-radius: 0;
		box-shadow: inset 0 0 0 2px #ffffff;
		color: #ffffff;
		cursor: pointer;
		display: inline-block;
		font-size: 0.8em;
		font-weight: 600;
		height: 3.5em;
		letter-spacing: 0.25em;
		line-height: 3.5em;
		padding: 0 1.75em;
		text-align: center;
		text-decoration: none;
		text-transform: uppercase;
		white-space: nowrap;
        }
        .back-btn:hover {
            background: #242943;
        }

        /* follows the system setting, like the rest of the site */
        @media (prefers-color-scheme: light) {
            html { color-scheme: light; }
            body { background: #f4f6fb; }
            .qr-container { background: #ffffff; border-color: rgba(30, 36, 54, 0.15); color: #1e2436; }
            .back-btn { box-shadow: inset 0 0 0 2px rgba(30, 36, 54, 0.22); color: #1e2436; }
            .back-btn:hover { box-shadow: inset 0 0 0 2px #0e7490; color: #0e7490; }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <h2>Scan to add on WeChat</h2>
        <!-- Replace the src below with your actual QR code image -->
        <img src="./images/wechat.jpg" alt="WeChat QR Code">
        <br>
        <a href="javascript:history.back()" class="back-btn">Back</a>
    </div>
</body>
</html>
